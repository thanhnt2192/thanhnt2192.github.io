<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    canvas {
      border: 1px solid black;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <script>
    window.app = {
      screen: {
        canvas: window.document.getElementById("screen"),
        initialize: function () {
          this.context = this.canvas.getContext('2d');
          this.image = this.context.getImageData(0, 0, this.canvas.width, this.canvas.height, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
        },
        drawable: {
          list: []
        },
        refresh: function () {
          for (let i = 0; i < this.drawable.list.length; i++) {
            const { palette, bitmap, x, y, width, height } = this.drawable.list[i];
            for (let color = 0; color < palette.length; color++) {
              for (let row = 0; row < bitmap[color].length && row < height; row++) {
                for (let column = 0; column < bitmap[color][row].length && column < width; column++) {
                  if (bitmap[color][row][column] === 0) {
                    continue;
                  }
                  const dy = row + y;
                  const dx = column + x;
                  this.image.data[dy * this.canvas.width * 4 + dx * 4 + 0] = palette[color]["r"];
                  this.image.data[dy * this.canvas.width * 4 + dx * 4 + 1] = palette[color]["g"];
                  this.image.data[dy * this.canvas.width * 4 + dx * 4 + 2] = palette[color]["b"];
                  this.image.data[dy * this.canvas.width * 4 + dx * 4 + 3] = 255;
                }
              }
            }
          }
          this.context.putImageData(this.image, 0, 0);
        }
      },
      index: {},
      image: {
        list: []
      },
      script: {
        list: [],
        main: function () {
          this.activate(0);
        },
        activate: function (i) {
          this.main = this.list[i];
        },
        run: function (i) {
          const f = this.list[i];
          f();
        }
      },
      text: {
        font: {
          list: []
        },
        sequence: {
          list: []
        },
        print: function (fi, si) {
          const f = this.font.list[fi];
          const s = this.sequence.list[si];
          let lineWidth = 0;
          let lineHeight = 0;
          for (const c of s) {
            lineWidth += f[c].width;
            if (lineHeight < f[c].height) {
              lineHeight = f[c].height;
            }
          }
        }
      },
      memory: {
        list: [],
        read: function (i) {
          return this.list[i];
        },
        write: function (i, value) {
          this.list[i] = value;
        }
      },
      mul: (a, b) => {
        return a * b;
      },
      div: (a, b) => {
        return Math.trunc(a / b);
      },
      mod: (a, b) => {
        return a % b;
      },
      clone: (value) => window.structuredClone(value),
      load: function () {
        this.screen.drawable.define = (index) => {
          if (!!index) {
            this.index[index] = this.screen.drawable.list.length;
          }
          this.screen.drawable.list.push({
            palette: [],
            bitmap: [],
            x: 0,
            y: 0,
            width: 0,
            height: 0
          });
        };
        this.image.define = (index, o) => {
          if (!!index) {
            this.index[index] = this.image.list.length;
          }
          this.image.list.push(o);
        };
        this.image.load = (imageIndex, screenDrawableIndex, x, y) => {
          const d = this.screen.drawable.list[screenDrawableIndex];

          const palette = {};
          for (let color = 1; color < this.screen.drawable.list[screenDrawableIndex].length; color++) {
            let key = '#';
            key += this.screen.drawable.list[screenDrawableIndex][color]["r".toString(16).toUpperCase().padStart(2, "0")];
            key += this.screen.drawable.list[screenDrawableIndex][color]["g".toString(16).toUpperCase().padStart(2, "0")];
            key += this.screen.drawable.list[screenDrawableIndex][color]["b".toString(16).toUpperCase().padStart(2, "0")];
            palette[key] = color;
          }
          for (let color = 1; color < this.image.list[imageIndex].length; color++) {
            let key = '#';
            key += this.image.list[imageIndex][color]["r".toString(16).toUpperCase().padStart(2, "0")];
            key += this.image.list[imageIndex][color]["g".toString(16).toUpperCase().padStart(2, "0")];
            key += this.image.list[imageIndex][color]["b".toString(16).toUpperCase().padStart(2, "0")];
            if (palette[key] === undefined) {
              palette[key] = d.length;
              d.push(this.clone(this.image.list[imageIndex][color]));
            }
          }

          for (let row = y; row < this.image.list[imageIndex][0].length; row++) {
            if (d[0].length > row) {
              //
            } else {
              for (let i = d[0].length - 1; i < row; i++) {
                d[0].push([]);
              }
            }

            for (let column = x; column < this.image.list[imageIndex][0][row].length; column++) {
              if (d[0][row].length > column) {
                d[0][row][column] = this.image.list[imageIndex][0][row][column];
              } else {
                for (let i = d[0][row].length - 1; i < column; i++) {
                  d[0][row].push(0);
                }
                d[0][row][column] = this.image.list[imageIndex][0][row][column];
              }
            }
          }
        };
        this.script.define = (index, f) => {
          if (!!index) {
            this.index[index] = this.script.list.length;
          }
          this.script.list.push(f.bind(this));
        };
        this.memory.define = (index, quantity, value) => {
          if (!!index) {
            this.index[index] = this.memory.list.length;
          }
          for (let count = 0; count < quantity; count++) {
            this.memory.list.push(value);
          }
        };
      },
      launch: function () {
        this.screen.initialize();
      },
      render: function (timestamp) {
        // TODO: do something
        this.timestamp = Math.trunc(timestamp);
        this.script.main();
        this.screen.refresh();
      }
    };

    window.app.load();

    window.addEventListener('load', (event) => {
      window.app.launch();
      window.requestAnimationFrame(function animate(timestamp) {
        this.app.render(timestamp);
        this.requestAnimationFrame(animate);
      });
    });
  </script>
  <script src="./js/font.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
