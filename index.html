<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    canvas {
      border: 1px solid black;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <script>
    window.app = {
      screen: {
        canvas: window.document.getElementById("screen"),
        initialize: function () {
          this.context = this.canvas.getContext('2d');
          this.data = this.context.getImageData(0, 0, canvas.width, canvas.height, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
        },
        putData: function ({ data, width, height }, { x, y }) {
          for (let i = 0; i < data.length; i++) {
            const dy = Math.floor(i / (width * 4)) + y;
            const dx = Math.floor(i / 4) % width + x;
            if (dx < 0 || dx >= canvas.width || dy < 0 || dy >= canvas.height) {
              continue;
            }
            screenData[dy * canvas.width * 4 + dx * 4 + (i % 4)] = data[i];
          }
        }
      },
      launch: function () {
        this.screen.initialize();
      }
    };
  </script>
</body>
</html>
