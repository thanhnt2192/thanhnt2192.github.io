<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    canvas {
      border: 1px solid black;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <script>
    window.app = {
      screen: {
        canvas: window.document.getElementById("screen"),
        initialize: function () {
          this.context = this.canvas.getContext('2d');
          this.image = this.context.getImageData(0, 0, this.canvas.width, this.canvas.height, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
        },
        refresh: function () {
          this.context.putImageData(this.image, 0, 0);
        },
        putData: function ({ data, width, height }, { x, y }) {
          for (let i = 0; i < data.length; i++) {
            const dy = Math.floor(i / (width * 4)) + y;
            const dx = Math.floor(i / 4) % width + x;
            if (dx < 0 || dx >= this.canvas.width || dy < 0 || dy >= this.canvas.height) {
              continue;
            }
            this.image.data[dy * this.canvas.width * 4 + dx * 4 + (i % 4)] = data[i];
          }
        }
      },
      launch: function () {
        this.screen.initialize();
      },
      render: function (timestamp) {
        // TODO: do something
        this.screen.putData(this.font["A"], { x: 0, y: 0 });
        // console.log('render', this);
        this.screen.refresh();
      }
    };

    window.addEventListener('load', (event) => {
      window.app.launch();
      window.requestAnimationFrame(function animate(timestamp) {
        window.app.render(timestamp);
        window.requestAnimationFrame(animate);
      });
    });
  </script>
  <script src="./js/font.js"></script>
</body>
</html>
