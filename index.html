<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    canvas {
      border: 1px solid black;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <script>
    window.app = {
      screen: {
        canvas: window.document.getElementById("screen"),
        initialize: function () {
          this.context = this.canvas.getContext('2d');
          this.image = this.context.getImageData(0, 0, this.canvas.width, this.canvas.height, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
        },
        refresh: function () {
          this.context.putImageData(this.image, 0, 0);
        },
        putDataRaw: function ({ data, width, height }, { x, y }) {
          for (const c in data) {
            const r = parseInt(c.slice(0, 2), 16);
            const g = parseInt(c.slice(2, 4), 16);
            const b = parseInt(c.slice(4, 6), 16);
            for (let i = 0; i < data[c].length; i++) {
              if (data[c][i] === 0) {
                continue;
              }
              const dy = Math.floor(i / width) + y;
              const dx = i % width + x;
              if (dx >= 0 && dx < this.canvas.width && dy >= 0 && dy < this.canvas.height) {
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 0] = r;
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 1] = g;
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 2] = b;
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 3] = 255;
              }
            }
          }
        },
        putData: function ({ data, width, height }, { x, y, w, h }) {
          for (let i = 0; i < data.length; i++) {
            const dy = Math.floor(i / (width * 4)) + y;
            const dx = Math.floor(i / 4) % width + x;
            if (dx < 0 || dx >= this.canvas.width || dy < 0 || dy >= this.canvas.height) {
              continue;
            }
            if (dx >= 0 && dx < this.canvas.width && dy >= 0 && dy < this.canvas.height) {
              if ((typeof w === 'undefined' || dx < (x + w)) && (typeof h === 'undefined' || dy < (y + h))) {
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + (i % 4)] = data[i];
              }
            }
          }
        }
      },
      index: {},
      images: [],
      scripts: [],
      loadImage: function(index, { width, height, data }) {
        const arr = new Uint8ClampedArray(width * height * 4).fill(0);
        for (const c in data) {
          const r = parseInt(c.slice(0, 2), 16);
          const g = parseInt(c.slice(2, 4), 16);
          const b = parseInt(c.slice(4, 6), 16);
          for (let i = 0; i < data[c].length; i++) {
            if (data[c][i] === 0) {
              continue;
            }
            arr[i * 4 + 0] = r;
            arr[i * 4 + 1] = g;
            arr[i * 4 + 2] = b;
            arr[i * 4 + 3] = 255;
          }
        }
        if (!!index) {
          this.index[index] = this.images.length;
        }
        this.images.push({
          width,
          height,
          data: arr
        });
      },
      launch: function () {
        this.screen.initialize();
      },
      render: function (timestamp) {
        // TODO: do something
        this.screen.putData(this.images[this.index["A"]], { x: 0, y: 0 });
        // console.log('render', this);
        this.screen.refresh();
      }
    };

    window.addEventListener('load', (event) => {
      window.app.launch();
      window.requestAnimationFrame(function animate(timestamp) {
        this.app.render(timestamp);
        this.requestAnimationFrame(animate);
      });
    });
  </script>
  <script src="./js/font.js"></script>
</body>
</html>
