<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <style>
    canvas {
      border: 1px solid black;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="320" height="240"></canvas>
  <script>
    window.app = {
      graphics: [],
      construct: function (size, index) {
        for (let i = 0; i < size[0]; i++) {
          this.memory.push(0);
        }
        for (let i = 0; i < size[1]; i++) {
          this.graphics.push({
            x: 0,
            y: 0,
            column: 0,
            row: 0,
            width: 0,
            height: 0,
            image: []
          });
        }
        for (let key in indexSet) {
          this.index[key] = indexSet[key];
        }
      },
      screen: {
        canvas: window.document.getElementById("screen"),
        initialize: function () {
          this.context = this.canvas.getContext('2d');
          this.image = this.context.getImageData(0, 0, this.canvas.width, this.canvas.height, { colorSpace: 'srgb', pixelFormat: 'rgba-unorm8' });
        },
        drawable: {
          list: []
        },
        refresh: function () {
          for (let i = 0; i < this.drawable.list.length; i++) {
            const { image, x, y, column, row, width, height } = this.drawable.list[i];
            for (let sy = row; sy < image[0].length && sy < height; sy++) {
              for (let sx = column; sx < image[0][sy].length && sx < width; sx++) {
                if (image[0][sy][sx] === 0) {
                  continue;
                }
                const dy = sy + y;
                const dx = sx + x;
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 0] = image[image[0][sy][sx]]["r"];
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 1] = image[image[0][sy][sx]]["g"];
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 2] = image[image[0][sy][sx]]["b"];
                this.image.data[dy * this.canvas.width * 4 + dx * 4 + 3] = 255;
              }
            }
          }
          this.context.putImageData(this.image, 0, 0);
        }
      },
      index: {},
      image: {
        list: []
      },
      script: {
        list: [],
        main: function () {
          this.activate(0);
        },
        activate: function (i) {
          this.main = this.list[i];
        },
        run: function (i) {
          const f = this.list[i];
          f();
        }
      },
      text: {
        font: {
          list: []
        },
        sequence: {
          list: []
        },
        print: function (fi, si) {
          const f = this.font.list[fi];
          const s = this.sequence.list[si];
          let lineWidth = 0;
          let lineHeight = 0;
          for (const c of s) {
            lineWidth += f[c].width;
            if (lineHeight < f[c].height) {
              lineHeight = f[c].height;
            }
          }
        }
      },
      memory: {
        list: [],
        read: function (i) {
          return this.list[i];
        },
        write: function (i, value) {
          this.list[i] = value;
        }
      },
      mul: (a, b) => {
        return a * b;
      },
      div: (a, b) => {
        return Math.trunc(a / b);
      },
      mod: (a, b) => {
        return a % b;
      },
      clone: (value) => window.structuredClone(value),
      load: function () {
        this.screen.drawable.define = (index) => {
          if (!!index) {
            this.index[index] = this.screen.drawable.list.length;
          }
          this.screen.drawable.list.push({
            image: [[]],
            x: 0,
            y: 0,
            column: 0,
            row: 0,
            width: 0,
            height: 0
          });
        };
        this.image.define = (index, o) => {
          if (!!index) {
            this.index[index] = this.image.list.length;
          }
          this.image.list.push(o);
        };
        this.image.load = (imageIndex, screenDrawableIndex, x, y) => {
          const d = this.screen.drawable.list[screenDrawableIndex]["image"];
          const img = this.image.list[imageIndex];

          const palette = {};
          for (let color = 1; color < d.length; color++) {
            let key = '#';
            key += d[color]["r"].toString(16).toUpperCase().padStart(2, "0");
            key += d[color]["g"].toString(16).toUpperCase().padStart(2, "0");
            key += d[color]["b"].toString(16).toUpperCase().padStart(2, "0");
            palette[key] = color;
          }
          for (let color = 1; color < img.length; color++) {
            let key = '#';
            key += img[color]["r"].toString(16).toUpperCase().padStart(2, "0");
            key += img[color]["g"].toString(16).toUpperCase().padStart(2, "0");
            key += img[color]["b"].toString(16).toUpperCase().padStart(2, "0");
            if (palette[key] === undefined) {
              palette[key] = d.length;
              d.push(this.clone(img[color]));
            }
          }

          for (let sy = 0; sy < img[0].length; sy++) {
            if (d[0].length > sy + y) {
              //
            } else {
              for (let i = d[0].length; i < sy + y + 1; i++) {
                d[0].push([]);
              }
            }

            for (let sx = 0; sx < img[0][sy].length; sx++) {
              if (d[0][sy + y].length > sx + x) {
                //
              } else {
                for (let i = d[0][sy + y].length; i < sx + x + 1; i++) {
                  d[0][sy + y].push(0);
                }
              }
              d[0][sy + y][sx + x] = img[0][sy][sx];
            }
          }
        };
        this.script.define = (index, f) => {
          if (!!index) {
            this.index[index] = this.script.list.length;
          }
          this.script.list.push(f.bind(this));
        };
        this.memory.define = (index, quantity, value) => {
          if (!!index) {
            this.index[index] = this.memory.list.length;
          }
          for (let count = 0; count < quantity; count++) {
            this.memory.list.push(value);
          }
        };
      },
      launch: function () {
        this.screen.initialize();
      },
      render: function (timestamp) {
        // TODO: do something
        this.timestamp = Math.trunc(timestamp);
        this.script.main();
        this.screen.refresh();
      }
    };

    window.app.load();

    window.addEventListener('load', (event) => {
      window.app.launch();
      window.requestAnimationFrame(function animate(timestamp) {
        this.app.render(timestamp);
        this.requestAnimationFrame(animate);
      });
    });
  </script>
  <script src="./js/font.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
